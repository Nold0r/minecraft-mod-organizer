[package]
name = "minecraft-mod-organizer"
version = "0.1.3"
description = "Entity-oriented Minecraft mod organizer"
authors = ["you"]
edition = "2024"

[lib]
name = "minecraft_mod_organizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"
notify = "8.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate", "deflate64", "lzma", "zstd"] }
uuid = { version = "1.26.0", features = ["v4", "v5", "serde"] }
base64 = "0.22"
thiserror = "2"
parking_lot = "0.12"
